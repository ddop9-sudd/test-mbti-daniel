<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Test MBTI de funciones cognitivas</title>
<style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#12213b;--mut:#5b6b88;--b:#1f6feb;--bl:#e3eeff;--ln:#d5e2f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1322;--card:#13203a;--ink:#e8f0ff;--mut:#9fb2d4;--b:#6aa5ff;--bl:#1b2d52;--ln:#27406e}}
:root[data-theme=dark]{--bg:#0b1322;--card:#13203a;--ink:#e8f0ff;--mut:#9fb2d4;--b:#6aa5ff;--bl:#1b2d52;--ln:#27406e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito","Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;line-height:1.2;margin:0 0 .5em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:22px;margin-bottom:16px}
.band{height:6px;border-radius:6px;background:linear-gradient(90deg,#88619a 0 25%,#33a474 25% 50%,#4298b4 50% 75%,#e4ae3a 75%);margin-bottom:18px}
label{display:block;font-weight:700;margin:14px 0 4px}
input{width:100%;font:inherit;padding:12px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 20px;background:var(--b);color:#fff;cursor:pointer}
.btn.s{background:var(--bl);color:var(--b)}
.mut{color:var(--mut);font-size:.9rem}
.pb{height:10px;background:var(--bl);border-radius:10px;overflow:hidden}.pb i{display:block;height:100%;background:var(--b);transition:width .3s}
.q{font-size:1.25rem;font-family:"Fraunces",Georgia,serif;margin:18px 0}
.opt{display:flex;gap:12px;align-items:center;width:100%;min-height:50px;margin:8px 0;padding:10px 14px;text-align:left;font:inherit;border:1.5px solid var(--ln);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}
.opt b{width:28px;height:28px;border-radius:50%;background:var(--bl);color:var(--b);display:grid;place-items:center;flex:none}
.opt.on{border-color:var(--b);background:var(--bl)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.hero{text-align:center}.hero svg{width:150px;height:150px}.code{font:800 3rem/1 "Fraunces",Georgia,serif;letter-spacing:.06em}
.ax{margin:14px 0}.bar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--bl);margin-top:4px}.bar i{display:block;height:100%}
.fn{display:grid;grid-template-columns:34px 1fr 40px;gap:8px;align-items:center;margin:6px 0}.fn .bar{margin:0;height:10px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gal button{font:inherit;font-size:.8rem;font-weight:700;border:2px solid var(--ln);border-radius:14px;background:var(--card);color:var(--ink);padding:6px 2px;cursor:pointer}
.gal button.on{border-color:var(--c);background:var(--bl)}.gal svg{width:100%;height:auto}
textarea{width:100%;min-height:150px;font:13px/1.4 ui-monospace,monospace;padding:10px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{padding:3px 10px;border-radius:20px;background:var(--bl);color:var(--b);font-weight:700;font-size:.85rem}
.wrap{overflow-x:auto}footer{text-align:center;margin-top:24px}
@media(max-width:480px){.gal{grid-template-columns:repeat(4,1fr)}.code{font-size:2.4rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main id="app"></main>
<script>
const CFG={version:2,anchors:["En total desacuerdo","En desacuerdo","Neutral","De acuerdo","Totalmente de acuerdo"],scoring:"reverse=6-x; función=(suma-6)/24*100",
axes:[{id:"EI",a:"E",b:"I",la:"Extraversión",lb:"Introversión",A:["Ne","Se","Te","Fe"],B:["Ni","Si","Ti","Fi"]},{id:"NS",a:"N",b:"S",la:"Intuición",lb:"Sensación",A:["Ne","Ni"],B:["Se","Si"]},{id:"TF",a:"T",b:"F",la:"Pensamiento",lb:"Sentimiento",A:["Te","Ti"],B:["Fe","Fi"]},{id:"JP",a:"J",b:"P",la:"Juicio (Te+Fe)",lb:"Percepción (Ne+Se)",A:["Te","Fe"],B:["Ne","Se"]}],
mirror:[[4,6],[16,18],[28,30],[40,42],[9,11],[21,22],[33,35],[45,46]]};
const F=["Ne","Ni","Se","Si","Te","Ti","Fe","Fi"];
const Q=[[1,"Ne",0,"Ante un problema, mi mente genera rápidamente muchas ideas, hipótesis y caminos alternativos."],[2,"Ne",0,"Me fascina hacer lluvia de ideas y conectar conceptos de áreas completamente distintas."],[3,"Ne",1,"Prefiero concentrarme en una sola idea probada antes que perder tiempo explorando opciones inciertas."],[4,"Ne",0,"Disfruto especular sobre escenarios del tipo «¿qué pasaría si…?» aunque no tengan aplicación inmediata."],[5,"Ne",0,"Capto con rapidez el potencial oculto en proyectos, objetos o personas."],[6,"Ne",1,"Rara vez me interesa teorizar sobre el futuro o explorar conceptos abstractos sin utilidad práctica."],
[7,"Ni",0,"Suelo tener intuiciones repentinas en las que piezas sueltas de información encajan en una visión clara."],[8,"Ni",0,"Tiendo a enfocarme en una predicción central sobre cómo se desarrollarán los eventos a largo plazo."],[9,"Ni",1,"Prefiero reaccionar a lo que ocurre en el momento en lugar de buscar significados ocultos tras las situaciones."],[10,"Ni",0,"Me apasiona sintetizar mucha información compleja en un único principio o modelo integrador."],[11,"Ni",0,"Percibo tendencias e intenciones de fondo en un sistema antes de que sean evidentes."],[12,"Ni",0,"Busco constantemente el significado profundo o simbólico tras las experiencias cotidianas."],
[13,"Se",0,"Me siento totalmente presente en el aquí y el ahora, reaccionando con agilidad a mi entorno físico."],[14,"Se",0,"Disfruto de experiencias sensoriales intensas y de la acción directa (deportes, estética, entornos dinámicos)."],[15,"Se",1,"A menudo no noto lo que pasa a mi alrededor por estar sumergido en mis pensamientos."],[16,"Se",0,"Soy pragmático y prefiero resolver las cosas interactuando directamente con el entorno en tiempo real."],[17,"Se",0,"Capto al instante detalles físicos sutiles que otras personas pasan por alto."],[18,"Se",1,"Me resulta incómodo o torpe improvisar respuestas físicas ante situaciones imprevistas."],
[19,"Si",0,"Uso mis experiencias vividas como guía detallada para decidir en el presente."],[20,"Si",0,"Valoro las rutinas claras, las tradiciones comprobadas y seguir metodologías estándar con cuidado."],[21,"Si",1,"Me aburre la repetición y me cuesta prestar atención a detalles minuciosos o registros históricos."],[22,"Si",0,"Tengo muy buena memoria para datos específicos, fechas, secuencias y detalles de eventos pasados."],[23,"Si",0,"Soy muy consciente de mis sensaciones corporales y busco comodidad y estabilidad física."],[24,"Si",0,"Me siento más seguro trabajando dentro de un marco conocido y con antecedentes claros."],
[25,"Te",0,"Priorizo la eficiencia, los resultados medibles y la organización lógica de los recursos."],[26,"Te",0,"Me resulta natural tomar la dirección, estructurar cronogramas y delegar tareas para lograr metas colectivas."],[27,"Te",1,"Evito establecer reglas estrictas o imponer métricas de rendimiento a los demás."],[28,"Te",0,"Evalúo una idea principalmente por su efectividad empírica y su utilidad práctica inmediata."],[29,"Te",0,"Señalo sin rodeos la ineficiencia o la falta de lógica en un trabajo para optimizar el resultado."],[30,"Te",1,"Prefiero adaptar mis planes sobre la marcha antes que seguir una estructura formal."],
[31,"Ti",0,"Desgloso los problemas complejos en sus partes para comprender su mecánica interna."],[32,"Ti",0,"Exijo rigor en las definiciones e identifico incongruencias o falacias lógicas al instante."],[33,"Ti",1,"Acepto explicaciones generales sin necesidad de analizar a fondo las premisas de un argumento."],[34,"Ti",0,"Disfruto construyendo modelos mentales exactos por el valor de la coherencia interna y el conocimiento."],[35,"Ti",0,"Razono de forma imparcial, aislando las emociones para llegar a la verdad objetiva."],[36,"Ti",0,"Prefiero descubrir por mí mismo cómo funcionan las cosas en vez de aceptar verdades por autoridad o tradición."],
[37,"Fe",0,"Soy muy sensible a la atmósfera emocional de un grupo y busco cohesión, empatía y armonía."],[38,"Fe",0,"Adapto mi comportamiento con fluidez a las necesidades y expectativas afectivas de quienes me rodean."],[39,"Fe",1,"Me es indiferente si mis comentarios o decisiones generan incomodidad o fricción en el grupo."],[40,"Fe",0,"Expreso con facilidad calidez, apoyo y validación emocional a las personas en momentos difíciles."],[41,"Fe",0,"Busco construir consensos donde todas las partes se sientan integradas y valoradas."],[42,"Fe",1,"Prefiero no involucrarme en los problemas emocionales ajenos ni mediar en desacuerdos."],
[43,"Fi",0,"Mis decisiones se rigen por una brújula ética interna y una escala de valores personales innegociable."],[44,"Fi",0,"Defiendo mi autenticidad e individualidad con firmeza, sin ceder ante la presión social o las modas."],[45,"Fi",1,"A menudo me cuesta identificar lo que siento o cuáles son mis verdaderas prioridades éticas."],[46,"Fi",0,"Tengo convicciones morales intensas y una profunda empatía por personas o causas vulnerables."],[47,"Fi",0,"Valoro que la gente sea genuina consigo misma por encima del protocolo o la cortesía superficial."],[48,"Fi",0,"Prefiero guardar mis sentimientos más íntimos para mí antes que exponerlos públicamente."]];
const QM={};Q.forEach(q=>QM[q[0]]=q);
const T=[["INTJ","El Arquitecto","♟️","Ni Te Fi Se","Estratega independiente: ve patrones a largo plazo y los convierte en planes eficientes. Exigente con la calidad de las ideas.","Directa y concisa; prefiere argumentos sólidos a la charla superficial."],
["INTP","El Lógico","🔬","Ti Ne Si Fe","Analista curioso que desarma ideas para entender cómo funcionan. Original, preciso y amante de los modelos coherentes.","Explica con precisión y matices; disfruta debatir ideas."],
["ENTJ","El Comandante","👑","Te Ni Se Fi","Líder natural que organiza recursos y personas hacia metas ambiciosas. Decidido y orientado a resultados.","Clara, firme y orientada a la acción."],
["ENTP","El Innovador","💡","Ne Ti Fe Si","Generador de ideas y debatiente ingenioso; ve posibilidades donde otros ven límites.","Ágil, divertida y provocadora; le encanta cuestionar."],
["INFJ","El Consejero","🔮","Ni Fe Ti Se","Visionario empático: intuye lo que hay detrás de las personas y busca un propósito profundo. Reservado, íntegro y comprometido con ayudar.","Cálida y reflexiva; escucha a fondo y guía con tacto."],
["INFP","El Mediador","🌙","Fi Ne Si Te","Idealista con una brújula de valores muy clara. Creativo, sensible y fiel a su autenticidad.","Sincera y gentil; se expresa mejor por escrito o en confianza."],
["ENFJ","El Protagonista","🌟","Fe Ni Se Ti","Mentor carismático que inspira y une a los grupos; atento al potencial de cada persona.","Expresiva y motivadora; cuida la armonía del grupo."],
["ENFP","El Activista","🎈","Ne Fi Te Si","Entusiasta explorador de posibilidades; conecta ideas y personas con energía contagiosa.","Animada y empática; salta entre temas con pasión."],
["ISTJ","El Logista","📋","Si Te Fi Ne","Responsable y metódico; confiable, detallista y firme en sus compromisos.","Directa y factual; valora la claridad y la puntualidad."],
["ISFJ","El Defensor","🛡️","Si Fe Ti Ne","Protector leal, atento a los detalles que hacen sentir bien a los demás; constante y servicial.","Amable y discreta; muestra cariño con acciones concretas."],
["ESTJ","El Ejecutivo","🧭","Te Si Ne Fi","Organizador práctico que establece orden, reglas y resultados medibles; franco y dedicado.","Directa y estructurada; va al punto."],
["ESFJ","El Cónsul","🤝","Fe Si Ne Ti","Anfitrión social y cooperativo; pendiente del bienestar del grupo y de las tradiciones compartidas.","Cercana y comunicativa; busca que todos se sientan incluidos."],
["ISTP","El Virtuoso","🔧","Ti Se Ni Fe","Solucionador práctico y sereno; domina herramientas y actúa con precisión bajo presión.","Breve y concreta; prefiere mostrar a explicar."],
["ISFP","El Aventurero","🎨","Fi Se Ni Te","Artista tranquilo, sensible al entorno y fiel a sus valores; vive el presente con libertad.","Suave y auténtica; expresa más con hechos que con discursos."],
["ESTP","El Emprendedor","🏄","Se Ti Fe Ni","Audaz y pragmático; reacciona rápido, disfruta la acción y negocia con soltura.","Directa, enérgica y con humor; resuelve en el momento."],
["ESFP","El Animador","🎤","Se Fi Te Ni","Espontáneo y cálido; contagia energía y disfruta compartir experiencias.","Expresiva y divertida; conecta rápido con la gente."]];
const GN=["Analistas","Diplomáticos","Centinelas","Exploradores"],GC=["#88619a","#33a474","#4298b4","#e4ae3a"];
const grp=c=>c[1]=="N"?(c[2]=="T"?0:1):(c[3]=="J"?2:3);
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function mono(t){const c=GC[grp(t[0])];return `<svg viewBox="0 0 100 100" role="img" aria-label="${t[0]}"><rect x="22" y="60" width="56" height="38" rx="22" fill="${c}"/><circle cx="50" cy="42" r="25" fill="#ffe0c2"/><path d="M25 40a25 25 0 0 1 50 0q-25-16-50 0z" fill="${c}"/><circle cx="41" cy="46" r="3" fill="#223"/><circle cx="59" cy="46" r="3" fill="#223"/><path d="M43 55q7 6 14 0" stroke="#223" stroke-width="2.4" fill="none" stroke-linecap="round"/><text x="50" y="17" font-size="20" text-anchor="middle">${t[2]}</text></svg>`}
let S={name:"",year:"",order:[],ans:{},i:0,v:"home"};
const save=()=>{try{localStorage.setItem("mbti2",JSON.stringify(S))}catch(e){}};
try{const r=JSON.parse(localStorage.getItem("mbti2")||"null");if(r&&r.order&&r.order.length==48&&r.v=="test")S=r}catch(e){}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkOrder(){const r=rng(Date.now()%1e9);let best;for(let k=0;k<300;k++){const o=Q.map(q=>q[0]);for(let i=47;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]]}best=o;if(CFG.mirror.every(([a,b])=>Math.abs(o.indexOf(a)-o.indexOf(b))>=8))break}return best}
const sv=(id,ans)=>QM[id][2]?6-ans[id]:ans[id];
function calc(ans){const sum={};F.forEach(f=>sum[f]=0);Q.forEach(q=>sum[q[1]]+=sv(q[0],ans));const s={};F.forEach(f=>s[f]=Math.round((sum[f]-6)/24*100));
const ax=CFG.axes.map(x=>{const a=x.A.reduce((t,f)=>t+s[f],0),b=x.B.reduce((t,f)=>t+s[f],0);const p=a+b?Math.round(a/(a+b)*100):50;return{...x,p,L:p>=50?x.a:x.b}});
const code=ax.map(x=>x.L).join(""),bad=CFG.mirror.filter(([a,b])=>Math.abs(sv(a,ans)-sv(b,ans))>=3);return{s,ax,code,bad,t:T.find(t=>t[0]==code)}}
function home(){S.v="home";$("#app").innerHTML=`<div class="card"><div class="band"></div><h1>¿Cuál es tu tipo MBTI?</h1><p>48 afirmaciones sobre cómo piensas y decides. Te toma unos 8 minutos. Responde con lo primero que sientas, no con lo que te gustaría ser.</p><label for="n">Tu nombre o alias</label><input id="n" autocomplete="given-name" value="${esc(S.name)}"><label for="y">Año de nacimiento <span class="mut">(opcional)</span></label><input id="y" inputmode="numeric" maxlength="4" placeholder="1998" value="${esc(S.year)}"><p class="mut">Tus respuestas no se guardan en ningún servidor. Al final podrás copiar tu reporte y enviárselo a Daniel.</p><button class="btn" id="go">Empezar el test</button></div><footer class="mut">Creado por Daniel · Herramienta orientativa, no es una evaluación psicológica validada.</footer>`;
$("#go").onclick=()=>{const n=$("#n").value.trim();if(!n){$("#n").focus();$("#n").placeholder="Escribe tu nombre para continuar";return}S={name:n,year:$("#y").value.replace(/\D/g,"").slice(0,4),order:mkOrder(),ans:{},i:0,v:"test"};save();ask()}}
function ask(){const id=S.order[S.i],q=QM[id],n=S.i+1,cur=S.ans[id];
$("#app").innerHTML=`<div class="card"><div class="row"><b>Pregunta ${n} de 48</b><span class="mut">${Math.round((n-1)/48*100)}%</span></div><div class="pb" role="progressbar" aria-valuemin="0" aria-valuemax="48" aria-valuenow="${n-1}"><i style="width:${(n-1)/48*100}%"></i></div><p class="q" aria-live="polite">${q[3]}</p><div role="radiogroup" aria-label="Qué tan de acuerdo estás">${CFG.anchors.map((a,k)=>`<button class="opt${cur==k+1?" on":""}" role="radio" aria-checked="${cur==k+1}" data-v="${k+1}"><b>${k+1}</b>${a}</button>`).join("")}</div><div class="row" style="margin-top:12px"><button class="btn s" id="bk" ${S.i?"":"disabled"}>Atrás</button><span class="mut">Teclas 1–5</span></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.v));$("#bk").onclick=()=>{if(S.i>0){S.i--;save();ask()}}}
let lock=0;function pick(v){if(lock)return;lock=1;const id=S.order[S.i];S.ans[id]=v;document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("on",+b.dataset.v==v));setTimeout(()=>{lock=0;if(S.i<47){S.i++;save();ask()}else{S.v="res";try{localStorage.removeItem("mbti2")}catch(e){}res()}},250)}
document.addEventListener("keydown",e=>{if(S.v!="test"||!$(".opt"))return;if(e.key>="1"&&e.key<="5")pick(+e.key);if(e.key=="ArrowLeft"&&S.i>0){S.i--;ask()}});
function detail(t){return `<h3>${t[2]} ${t[0]} · ${t[1]}</h3><div class="tags"><span>${GN[grp(t[0])]}</span>${t[3].split(" ").map((f,i)=>`<span>${["Dominante","Auxiliar","Terciaria","Inferior"][i]}: ${f}</span>`).join("")}</div><p>${t[4]}</p><p><b>Estilo de comunicación:</b> ${t[5]}</p>`}
function report(R){const d=new Date().toLocaleDateString("es-MX");return `REPORTE MBTI · FUNCIONES COGNITIVAS\nNombre: ${S.name}${S.year?" ("+S.year+")":""} · Fecha: ${d}\nTIPO: ${R.code} — ${R.t[1]} (pila: ${R.t[3]})\n\nEjes:\n${R.ax.map(x=>`${x.a}/${x.b}: ${x.a} ${x.p}% · ${x.b} ${100-x.p}% → ${x.L}`).join("\n")}\n\nFunciones (0-100): ${F.map(f=>f+" "+R.s[f]).join(", ")}\n\nPerfil: ${R.t[4]}\nComunicación: ${R.t[5]}\nInconsistencias en respuestas: ${R.bad.length} de 8 pares${R.bad.length>=3?" (resultado poco fiable)":""}`}
function json(R){const a={};Q.forEach(q=>a[q[0]]=S.ans[q[0]]);return JSON.stringify({v:CFG.version,name:S.name,year:S.year,type:R.code,axes:Object.fromEntries(R.ax.map(x=>[x.id,x.p])),functions:R.s,inconsistent:R.bad,answers:a})}
function res(){S.v="res";const R=calc(S.ans),t=R.t,c=GC[grp(R.code)];window.R=R;
$("#app").innerHTML=`<div class="card hero"><div class="band"></div><p class="mut">${esc(S.name)}, tu tipo es</p>${mono(t)}<div class="code" style="color:${c}">${R.code}</div><h2>${t[1]}</h2><p>${t[4]}</p></div>
<div class="card"><h2>Tus 4 ejes</h2>${R.ax.map(x=>`<div class="ax"><div class="row"><span>${x.a} · ${x.la}</span><span>${x.lb} · ${x.b}</span></div><div class="bar" role="img" aria-label="${x.a} ${x.p}%, ${x.b} ${100-x.p}%"><i style="width:${x.p}%;background:${x.p>=50?c:"var(--b)"};opacity:${x.p>=50?1:.45}"></i></div><div class="row mut"><span>${x.p}%</span><span>${100-x.p}%</span></div></div>`).join("")}</div>
<div class="card"><h2>Tus 8 funciones</h2>${F.map(f=>`<div class="fn"><b>${f}</b><div class="bar"><i style="width:${R.s[f]}%;background:var(--b)"></i></div><span>${R.s[f]}</span></div>`).join("")}<p class="mut">Pila estimada de tu tipo: ${t[3]}. ${R.bad.length>=3?"Varias respuestas se contradijeron entre sí; toma el resultado con cautela.":"Tus respuestas fueron consistentes."}</p></div>
<div class="card"><h2>Los 16 tipos</h2><div class="gal">${T.map(x=>`<button data-c="${x[0]}" style="--c:${GC[grp(x[0])] }" class="${x[0]==R.code?"on":""}">${mono(x)}${x[0]}</button>`).join("")}</div><div id="det" style="margin-top:14px">${detail(t)}</div><p class="mut">${GN.map((g,i)=>`<span style="color:${GC[i]}">●</span> ${g}`).join("  ")}</p></div>
<div class="card"><h2>Envía tu reporte a Daniel</h2><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" id="c1">Copiar reporte</button><button class="btn s" id="c2">Copiar JSON</button></div><p class="mut" id="msg">Pega el texto en un mensaje y envíaselo.</p><textarea id="ta" readonly aria-label="Reporte"></textarea></div>
<button class="btn s" id="rs">Hacer el test otra vez</button><footer class="mut">Creado por Daniel · Herramienta orientativa, no es una evaluación psicológica validada.</footer>`;
